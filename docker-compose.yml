services:
  db:
    image: postgres:16
    container_name: flowops-db
    environment:
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
      POSTGRES_DB: flowops
    ports:
      - "5433:5432"
    volumes:
      - flowops-data:/var/lib/postgresql/data
      - ./backend/prisma/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  flowops-data:
